ms:center;justify-content:center;border-bottom:1px solid #f3f3f2;position:relative;font-size:20px;font-weight:750}.close{position:absolute;right:20px;top:12px;border:0;background:transparent;font-size:29px;color:#555}.modal-body{overflow:auto;flex:1}.section{padding:22px 28px;border-bottom:10px solid #f1f1ef}.section-title{display:flex;align-items:center;justify-content:space-between;font-size:21px;font-weight:750;cursor:pointer}.caret{font-size:19px;transition:transform .2s}.section.collapsed .caret{transform:rotate(180deg)}.section-content{padding-top:18px}.section.collapsed .section-content{display:none}.hint{color:#999;margin:0 0 13px}.green{color:var(--green)}.range-wrap{position:relative;height:72px;padding:26px 10px 0}.range-track{position:absolute;left:10px;right:10px;top:30px;height:8px;border-radius:9px;background:#e7e7e4;pointer-events:none}.range-progress{position:absolute;left:0;top:0;height:100%;border-radius:9px;background:var(--yellow)}.range{position:absolute;left:10px;top:21px;width:calc(100% - 20px);height:26px;margin:0;background:transparent;appearance:none;-webkit-appearance:none;pointer-events:none;touch-action:none}.range::-webkit-slider-runnable-track{height:8px;background:transparent}.range::-webkit-slider-thumb{width:30px;height:30px;margin-top:-11px;border:0;border-radius:50%;appearance:none;-webkit-appearance:none;background:#fff;box-shadow:0 2px 8px #0002;pointer-events:auto;cursor:grab}.range::-moz-range-track{height:8px;background:transparent}.range::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0002;pointer-events:auto;cursor:grab}#minPrice{z-index:2}#maxPrice{z-index:1}.range:focus{outline:0}.range-labels{position:absolute;left:10px;right:10px;bottom:0;display:flex;justify-content:space-between;color:#929289;font-size:13px}.priority-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #eee7bd;background:#fffdf2;border-radius:12px;pad <script>
const categories=[
 {id:'room',name:'객실 & 침대',groups:[['객실',['집 전체','개인실','다인실']],['공간',['개인 욕실','주방','복층']],['침대',['싱글','슈퍼싱글','퀸','킹','더블','2층 침대','소파베드']]]},
 {id:'amenities',name:'편의시설',groups:[['인기',['세탁기','에어컨','난방','와이파이','엘리베이터','전자레인지']],['추가 편의시설',['건조기','주차','책상','발코니','TV','정수기']]]},
 {id:'rules',name:'지원 & 규정',groups:[['지원',['영상 투어 제공','RC 서류 준비 완료']],['성별',['전체 성별','성별 무관','여성 전용','남성 전용']],['반려동물',['반려동물 동반 가능']]]},
 {id:'building',name:'건물 유형',groups:[['유형',['오피스텔','고시원 / 원룸텔','브랜드 레지던스','APT (아파트)','빌라','단독주택','레지던스 호텔','게스트하우스']]]},
 {id:'floor',name:'층수',groups:[['층수',['저층 (지층, 반지층, 1층)','중층 (2층~7층)','고층 (8층 이상)']]]}
];
const weights=[35,25,18,13,9];
const imagePool=[
 'https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=900&q=80',
 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=900&q=80',
 'https://images.unsplash.com/photo-1617104678098-de229db51175?auto=format&fit=crop&w=900&q=80',
 'https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=900&q=80',
 'https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=900&q=80',
 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=900&q=80'
];
function sampleOne(list){return list[Math.floor(Math.random()*list.length)]}
function sampleSome(list,min=1,max=2){let shuffled=[...list].sort(()=>Math.random()-.5);return shuffled.slice(0,min+Math.floor(Math.random()*(max-min+1)))}
function createSampleStays(count){const roomOptions=['집 전체','개인실','다인실'],spaceOptions=['개인 욕실','주방','복층'],bedOptions=['싱글','슈퍼싱글','퀸','킹','더블','2층 침대','소파베드'],amenityOptions=['세탁기','에어컨','난방','와이파이','엘리베이터','전자레인지'],extraOptions=['건조기','주차','책상','발코니','TV','정수기'],buildingOptions=['오피스텔','고시원 / 원룸텔','브랜드 레지던스','APT (아파트)','빌라','단독주택','레지던스 호텔','게스트하우스'],floorOptions=['저층 (지층, 반지층, 1층)','중층 (2층~7층)','고층 (8층 이상)'],supportOptions=['영상 투어 제공','RC 서류 준비 완료'];
 return Array.from({length:count},(_,i)=>{let gender=sampleOne(['성별 무관','여성 전용','남성 전용']);return {id:i+1,name:`샘플 스테이 ${String(i+1).padStart(3,'0')}`,price:Math.round((550000+Math.random()*3050000)/10000)*10000,room:sampleSome(roomOptions,1,1),space:sampleSome(spaceOptions,0,2),bed:sampleSome(bedOptions,1,3),amenities:Math.random()<.08?null:sampleSome(amenityOptions,2,5),extra:Math.random()<.15?null:sampleSome(extraOptions,1,3),support:sampleSome(supportOptions,0,2),gender:Math.random()<.08?null:gender,pets:Math.random()<.35,building:sampleOne(buildingOptions),floor:sampleOne(floorOptions),img:sampleOne(imagePool),badge:sampleOne(['가상 매물','샘플 숙소','데모 데이터'])}})}
const stays=createSampleStays(500);
let state={min:500000,max:3600000,order:categories.map(c=>c.id),required:[],selected:{}};let sortMode='recommended';let mapZoom=1;let visibleLimit=24;
const cat=id=>categories.find(c=>c.id===id);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function buildFilters(){let html=`<section class="section" data-sec="price"><div class="section-title">금액 범위 <span class="caret">⌃</span></div><div class="section-content"><p class="hint">표시된 금액은 1개월 기준 임대료입니다.</p><div class="green" id="priceLabel"></div><div class="range-wrap"><div class="range-track"><div class="range-progress" id="rangeProgress"></div></div><input class="range" id="minPrice" aria-label="최소 월 임대료" type="range" min="500000" max="3600000" step="50000" value="${state.min}"><input class="range" id="maxPrice" aria-label="최대 월 임대료" type="range" min="500000" max="3600000" step="50000" value="${state.max}"><div class="range-labels"><span>최소</span><span>₩1.8M</span><span>₩3.6M</span><span>최대</span></div></div></div></section>`;
html+=`<section class="section" data-sec="priority"><div class="section-title">검색 우선순위 설정 <span class="caret">⌃</span></div><div class="section-content"><p class="hint">중요한 항목을 위로 옮기고, 꼭 필요한 대주제는 필수로 선택하세요.</p><div class="priority-summary"><div class="summary-text" id="prioritySummary"></div><button class="expand" id="expandPriority">상세 설정 펼치기⌄</button></div><div class="priority-rows" id="priorityRows"></div></div></section>`;
categories.forEach(c=>{html+=`<section class="section" data-sec="${c.id}"><div class="section-title">${c.name}<span class="tags" id="tag-${c.id}"></span><span class="caret">⌃</span></div><div class="section-content">`;
c.groups.forEach((g,gi)=>{html+=`<div class="options-block"><div class="options-title">${g[0]}</div><div class="checks">${g[1].map((o,oi)=>{let key=`${c.id}:${gi}:${oi}`;return `<label class="check"><input type="checkbox" data-key="${key}" ${state.selected[key]?'checked':''}>${o}</label>`}).join('')}</div></div>`});
html+='</div></section>'});document.getElementById('filterBody').innerHTML=html;document.querySelectorAll('.section-title').forEach(t=>t.addEventListener('click',()=>t.parentElement.classList.toggle('collapsed')));document.getElementById('expandPriority').onclick=()=>{document.getElementById('priorityRows').classList.toggle('open');document.getElementById('expandPriority').textContent=document.getElementById('priorityRows').classList.contains('open')?'상세 설정 접기⌃':'상세 설정 펼치기⌄'};document.getElementById('minPrice').oninput=e=>{state.min=+e.target.value;if(state.min>state.max){state.max=state.min;document.getElementById('maxPrice').value=state.max}render()};document.getElementById('maxPrice').oninput=e=>{state.max=+e.target.value;if(state.max<state.min){state.min=state.max;document.getElementById('minPrice').value=state.min}render()};document.querySelectorAll('[data-key]').forEach(el=>el.onchange=()=>{state.selected[el.dataset.key]=el.checked;render()});renderPriority()}
function renderPriority(){let rows=document.getElementById('priorityRows');if(!rows)return;rows.innerHTML=state.order.map((id,i)=>`<div class="priority-row" draggable="true" data-id="${id}"><span class="grip">⠿</span><span class="rank">${i+1}순위</span><b>${cat(id).name}</b><label class="required"><input type="checkbox" data-required="${id}" ${state.required.includes(id)?'checked':''}> 필수</label></div>`).join('');document.getElementById('prioritySummary').innerHTML=`현재 <b>${cat(state.order[0]).name}</b> 우선 · 필수 ${state.required.length}개`;rows.querySelectorAll('[data-required]').forEach(el=>el.onchange=()=>{state.required=el.checked?[...state.required,el.dataset.required]:state.required.filter(x=>x!==el.dataset.required);renderPriority();render()});let drag=null;rows.querySelectorAll('.priority-row').forEach(row=>{row.ondragstart=()=>{drag=row.dataset.id;row.classList.add('dragging')};row.ondragend=()=>row.classList.remove('dragging');row.ondragover=e=>e.preventDefault();row.ondrop=e=>{e.preventDefault();let target=row.dataset.id;if(drag===target)return;let a=state.order.indexOf(drag),b=state.order.indexOf(target);state.order.splice(a,1);state.order.splice(b,0,drag);renderPriority();render()}})}
function groupValues(stay,c,gi){if(c.id==='room')return [stay.room,stay.space,stay.bed][gi]||[];if(c.id==='amenities')return gi===0?stay.amenities:stay.extra;if(c.id==='rules')return [stay.support,stay.gender===null?null:[stay.gender],stay.pets?['반려동물 동반 가능']:[]][gi]||[];if(c.id==='building')return [stay.building];return [stay.floor]}
function selectedGroups(c){return c.groups.map((g,gi)=>{let opts=g[1].map((o,oi)=>({o,key:`${c.id}:${gi}:${oi}`})).filter(x=>state.selected[x.key]).map(x=>x.o);return {gi,opts}}).filter(x=>x.opts.length)}
function checkCategory(stay,c){let groups=selectedGroups(c);if(!groups.length)return {active:false,pass:true,rate:null};let states=groups.map(g=>{let vals=groupValues(stay,c,g.gi);if(vals===null)return null;return g.opts.some(o=>vals.includes(o))});let pass=groups.every(g=>g.opts.includes('전체 성별'))||states.every(x=>x!==false);return {active:true,pass,rate:states.filter(x=>x!==null).length?states.filter(x=>x===true).length/states.filter(x=>x!==null).length:null}}
function evaluate(stay){if(stay.price<state.min||stay.price>state.max)return null;let scores=[],denom=0;for(let i=0;i<state.order.length;i++){let id=state.order[i],c=cat(id),r=checkCategory(stay,c);if(!r.active)continue;if(state.required.includes(id)&&!r.pass)return null;if(!state.required.includes(id)&&r.rate!==null){let w=weights[i];scores.push({w,rate:r.rate});denom+=w}}return {stay,score:denom?scores.reduce((a,x)=>a+x.w*x.rate,0)/denom*100:null}}
function updatePriceLabel(){let f=n=>`₩${(n/10000).toLocaleString('ko-KR')}만`;document.getElementById('priceLabel').textContent=state.min===500000&&state.max===3600000?'모든 가격대':`${f(state.min)} ~ ${f(state.max)}`;let low=(state.min-500000)/(3600000-500000)*100,high=(state.max-500000)/(3600000-500000)*100;let progress=document.getElementById('rangeProgress');progress.style.left=`${low}%`;progress.style.width=`${high-low}%`}
function render(){let results=stays.map(evaluate).filter(Boolean).sort((a,b)=>sortMode==='price'?a.stay.price-b.stay.price:(b.score??-1)-(a.score??-1));document.getElementById('count').textContent=results.length;document.getElementById('apply').textContent=`${results.length}개 숙소 보기`;document.getElementById('cards').innerHTML=results.length?results.slice(0,visibleLimit).map(({stay,score})=>`<article class="card"><div class="photo"><img src="${stay.img}" alt="${esc(stay.name)}" loading="lazy"><span class="badge">${stay.badge}</span><button class="heart" type="button" aria-label="찜하기" aria-pressed="false">♡</button></div><div class="card-title">${esc(stay.name)}</div><div class="meta">공용 · 🛏 ${stay.room.join(', ')} · ♙ 1</div><div class="price">₩${stay.price.toLocaleString('ko-KR')} /월</div>${score!==null?`<span class="fit">추천 적합도 ${Math.round(score)}점</span>`:''}</article>`).join('')+(results.length>visibleLimit?`<button class="show-more" id="showMore">더 많은 가상 숙소 보기 (${Math.min(visibleLimit,results.length)} / ${results.length})</button>`:''):'<div class="empty">조건에 맞는 숙소가 없습니다.<br>필수 조건이나 금액 범위를 조정해 보세요.</div>';categories.forEach(c=>{let rank=state.order.indexOf(c.id)+1;document.getElementById(`tag-${c.id}`).textContent=`${rank}순위${state.required.includes(c.id)?' · 필수':''}`});updatePriceLabel()}
function reset(){state={min:500000,max:3600000,order:categories.map(c=>c.id),required:[],selected:{}};visibleLimit=24;buildFilters();render()}function openFilter(target){document.getElementById('scrim').classList.add('show');document.querySelectorAll('#filterBody > .section').forEach(section=>{let visible=target==='all'||section.dataset.sec===target;section.hidden=!visible;if(visible)section.classList.remove('collapsed')})}document.getElementById('open').onclick=()=>openFilter('all');document.getElementById('close').onclick=()=>document.getElementById('scrim').classList.remove('show');document.getElementById('scrim').onclick=e=>{if(e.target.id==='scrim')e.currentTarget.classList.remove('show')};document.getElementById('apply').onclick=()=>{document.getElementById('scrim').classList.remove('show');toast('필터를 적용했습니다')};document.getElementById('reset').onclick=reset;document.querySelectorAll('.nav [data-target]').forEach(button=>button.onclick=()=>openFilter(button.dataset.target));document.querySelectorAll('.nav [data-action="earlybird"]').forEach(button=>button.onclick=()=>toast('얼리버드 기능은 서비스 연동 후 사용할 수 있어요'));document.getElementById('login').onclick=()=>toast('로그인 기능은 서비스 연동 후 사용할 수 있어요');document.getElementById('searchBox').onclick=()=>toast('위치 검색은 서비스 연동 후 사용할 수 있어요');document.getElementById('searchBox').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toast('위치 검색은 서비스 연동 후 사용할 수 있어요')}};document.getElementById('sortButton').onclick=()=>{sortMode=sortMode==='recommended'?'price':'recommended';document.getElementById('sortButton').textContent=sortMode==='price'?'낮은 가격순 ⌄':'추천순 ⌄';render()};document.getElementById('cards').addEventListener('click',e=>{if(e.target.closest('#showMore')){visibleLimit+=24;render();return}let heart=e.target.closest('.heart');if(heart){let active=heart.getAttribute('aria-pressed')!=='true';heart.setAttribute('aria-pressed',String(active));heart.textContent=active?'♥':'♡';heart.setAttribute('aria-label',active?'찜 해제':'찜하기')}});document.getElementById('zoomIn').onclick=()=>{mapZoom=Math.min(mapZoom+.15,1.9);document.querySelector('.map svg').style.transform=`scale(${mapZoom})`};document.getElementById('zoomOut').onclick=()=>{mapZoom=Math.max(mapZoom-.15,.7);document.querySelector('.map svg').style.transform=`scale(${mapZoom})`};function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}buildFilters();render();
</script>
</body></html>
