project_id = "enkostay-filter-demo"

[auth]
site_url = "https://qowjdqks.github.io/enkostay-filter-demo/"
additional_redirect_urls = [
  "https://qowjdqks.github.io/enkostay-filter-demo/demo.html",
  "http://localhost:5173/demo.html",
  "http://127.0.0.1:5173/demo.html",
]

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
enable_confirmations = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.vector]
enabled = false

[functions.admin-users]
# The handler validates the session with auth.getUser(token) and checks admin_users.
verify_jwt = false
